<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Dunah IDE</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2314161c'/%3E%3Cpath d='M18 14h14c11 0 18 8 18 18s-7 18-18 18H18z' fill='%23ff8a3d'/%3E%3Cpath d='M30 25l-7 7 7 7' stroke='%2314161c' stroke-width='4.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#0f1115;--p:#171a21;--p2:#1d212a;--b:#2a2f3a;--t:#d7dae0;--m:#8b93a3;--a:#ff8a3d;--a2:#ff3d71}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font:13px system-ui,Segoe UI,sans-serif;display:grid;grid-template-rows:38px 1fr 24px;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--p);border-bottom:1px solid var(--b)}
header b{font-size:14px;letter-spacing:.5px}header .sp{flex:1}
button,select,input{background:var(--p2);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:4px 9px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--a)}button.pri{background:linear-gradient(135deg,var(--a),var(--a2));border:0;color:#111;font-weight:600}
main{display:grid;grid-template-columns:48px 300px 1fr;min-height:0}main.c{grid-template-columns:48px 0 1fr}main.c #side{display:none}
#act{background:#12151b;border-right:1px solid var(--b);display:flex;flex-direction:column;align-items:center;padding-top:4px}
#act button{width:48px;height:46px;border:0;border-left:2px solid transparent;border-radius:0;background:none;color:var(--m);display:grid;place-items:center;padding:0}
#act button:hover{color:var(--t)}#act button.on{color:var(--t);border-left-color:var(--a)}
#act svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#side{background:var(--p);overflow:auto;padding:8px;min-height:0;border-right:1px solid var(--b)}
.view{display:none;height:100%;min-height:0}.view.on{display:block}#v-ai.on{display:flex;flex-direction:column}
h4{margin:10px 0 6px;color:var(--m);font-size:11px;text-transform:uppercase;letter-spacing:1px}
#side select{width:100%;margin-bottom:6px}
.f{padding:3px 6px;cursor:pointer;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.f:hover{background:var(--p2)}.f.on{background:#2a2f3a}
details>summary{cursor:pointer;padding:3px 4px;color:var(--m)}details>div{padding-left:12px}
#mid{display:grid;grid-template-rows:32px 1fr;min-width:0}
#tabs{display:flex;background:var(--p);overflow-x:auto;border-bottom:1px solid var(--b)}
.tab{padding:7px 12px;cursor:pointer;border-right:1px solid var(--b);color:var(--m);white-space:nowrap}.tab.on{color:var(--t);background:var(--bg);box-shadow:inset 0 -2px var(--a)}
#ed{min-height:0}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:6px 0}
.msg{padding:8px;border-radius:8px;background:var(--p2);white-space:pre-wrap;word-break:break-word}.msg.u{background:#2a2f3a}
.msg pre{background:#0b0d11;padding:8px;border-radius:6px;overflow:auto;margin:6px 0}
#v-ai textarea{width:100%;height:70px;background:var(--p2);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:6px;font:inherit;resize:none}
footer{display:flex;gap:16px;align-items:center;padding:0 10px;background:linear-gradient(90deg,var(--a),var(--a2));color:#111;font-size:12px}
.mut{color:var(--m)}
@media(max-width:900px){main{grid-template-columns:48px 220px 1fr}}
</style></head><body>
<header>
<svg width="26" height="26" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff3d71"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="#14161c"/><path d="M18 14h14c11 0 18 8 18 18s-7 18-18 18H18z" fill="url(#g)"/><path d="M18 42c9-9 15 3 32-7-1 9-8 15-18 15H18z" fill="#fff" opacity=".22"/><path d="M30 25l-7 7 7 7" stroke="#14161c" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
<b>Dunah IDE</b>
<button id="newf">New file</button><button id="openf">Open folder</button><button id="save">Save (Ctrl+S)</button>
<span class="sp"></span><span id="user" class="mut"></span><button id="login" class="pri">Sign in with GitHub</button>
</header>
<main>
<nav id="act">
<button data-v="ai" title="Assistant (Ollama)"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
<button data-v="gh" title="GitHub"><svg viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 5-12 2-12 7"/></svg></button>
<button data-v="files" title="Files" class="on"><svg viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5zM14 3v5h5"/></svg></button>
</nav>
<div id="side">
<div id="v-ai" class="view">
<h4 style="margin-top:0">Assistant · Ollama</h4>
<div id="aimsg" class="mut">The Ollama assistant is available in the Dunah IDE Windows desktop app.</div>
<div id="aibox" style="display:none;flex:1;flex-direction:column;min-height:0">
<select id="model"></select><div id="log"></div>
<textarea id="q" placeholder="Ask about your code… (Enter to send, Shift+Enter newline)"></textarea>
<div style="display:flex;gap:6px;margin-top:6px"><button id="apply">Apply last code block</button><button id="clr">Clear</button></div>
</div></div>
<div id="v-gh" class="view">
<h4 style="margin-top:0">GitHub</h4><select id="repos" style="width:100%;margin-bottom:6px"><option>Sign in to load repos</option></select><div id="branch" class="mut"></div>
</div>
<div id="v-files" class="view on">
<h4 style="margin-top:0">Files</h4><div id="tree" class="mut">No folder open</div>
</div>
</div>
<div id="mid"><div id="tabs"></div><div id="ed"></div></div>
</main>
<footer><span id="st">Ready</span><span id="pos"></span><span style="flex:1"></span><span id="src">Scratch</span></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script>
const SB_URL='https://ermvrzqbxncmirhotrkv.supabase.co',SB_KEY='sb_publishable_azqJ_oKBUM047I13cFg-7w_xkIYK73t';
const OLLAMA='http://localhost:11434',DESKTOP=navigator.userAgent.includes('Electron');
const $=id=>document.getElementById(id),st=t=>$('st').textContent=t;
const sb=supabase.createClient(SB_URL,SB_KEY);
let editor,files={},cur=null,src={type:'scratch'},ghTok=localStorage.getItem('dunah_gh'),lastAI='',hist=[];

/* ---------- Activity bar ---------- */
function show(v,force){
  const m=document.querySelector('main'),same=document.querySelector('#act .on')?.dataset.v===v;
  if(same&&!force)m.classList.toggle('c');else m.classList.remove('c');
  document.querySelectorAll('#act button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
}
$('act').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.v)};

/* ---------- Auth ---------- */
sb.auth.onAuthStateChange((_e,s)=>{
  if(s?.provider_token){ghTok=s.provider_token;localStorage.setItem('dunah_gh',ghTok)}
  const u=s?.user?.user_metadata;$('user').textContent=s?u?.user_name||u?.preferred_username||s.user.email:'';
  $('login').textContent=s?'Sign out':'Sign in with GitHub';
  if(s&&ghTok){loadRepos();show('gh',true)}
});
$('login').onclick=async()=>{
  const {data}=await sb.auth.getSession();
  if(data.session){await sb.auth.signOut();localStorage.removeItem('dunah_gh');ghTok=null;location.reload()}
  else sb.auth.signInWithOAuth({provider:'github',options:{scopes:'repo read:user',redirectTo:location.origin+location.pathname}});
};

/* ---------- GitHub ---------- */
const gh=async(p,o={})=>{const r=await fetch('https://api.github.com'+p,{...o,headers:{Authorization:'Bearer '+ghTok,Accept:'application/vnd.github+json',...(o.headers||{})}});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120));return r.json()};
const b64d=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const b64e=s=>{let r='';new TextEncoder().encode(s).forEach(c=>r+=String.fromCharCode(c));return btoa(r)};
async function loadRepos(){
  try{const rs=await gh('/user/repos?per_page=100&sort=pushed');
  $('repos').innerHTML='<option value="">Select a repository…</option>'+rs.map(r=>`<option>${r.full_name}</option>`).join('')}
  catch(e){st('GitHub: '+e.message)}
}
$('repos').onchange=async e=>{
  const repo=e.target.value;if(!repo)return;st('Loading '+repo+'…');
  try{const info=await gh('/repos/'+repo),br=info.default_branch;
  const t=await gh(`/repos/${repo}/git/trees/${br}?recursive=1`);
  src={type:'gh',repo,br};$('src').textContent=repo+' @ '+br;
  renderTree(t.tree.filter(x=>x.type==='blob').map(x=>x.path));show('files',true);st(t.truncated?'Tree truncated':'Loaded')}
  catch(e){st(e.message)}
};

/* ---------- Local folder ---------- */
let dirH=null,handles={};
$('openf').onclick=async()=>{
  if(!window.showDirectoryPicker)return alert('Open Folder needs a Chromium browser (Chrome/Edge) or the desktop app.');
  dirH=await showDirectoryPicker({mode:'readwrite'});handles={};const paths=[];
  async function walk(d,p){for await(const [n,h] of d.entries()){
    if(['node_modules','.git','dist'].includes(n)||paths.length>3000)continue;
    if(h.kind==='directory')await walk(h,p+n+'/');else{handles[p+n]=h;paths.push(p+n)}}}
  await walk(dirH,'');src={type:'local'};$('src').textContent='Local: '+dirH.name;renderTree(paths);show('files',true);
};

/* ---------- Tree / files ---------- */
function renderTree(paths){
  const root={};paths.sort().forEach(p=>{let n=root;p.split('/').forEach((s,i,a)=>{n=n[s]??=(i==a.length-1?p:{})})});
  const h=(n)=>Object.entries(n).sort((a,b)=>(typeof b[1]=='object')-(typeof a[1]=='object')).map(([k,v])=>
    typeof v==='string'?`<div class="f" data-p="${v}">${k}</div>`:`<details><summary>${k}</summary><div>${h(v)}</div></details>`).join('');
  $('tree').innerHTML=h(root);
}
$('tree').onclick=e=>{const p=e.target.dataset?.p;if(p)openFile(p)};
async function openFile(p){
  if(!files[p]){
    let text='',sha;st('Opening '+p+'…');
    try{
      if(src.type==='gh'){const j=await gh(`/repos/${src.repo}/contents/${encodeURI(p)}?ref=${src.br}`);text=b64d(j.content);sha=j.sha}
      else if(src.type==='local')text=await (await handles[p].getFile()).text();
    }catch(e){return st(e.message)}
    files[p]={model:monaco.editor.createModel(text,undefined,monaco.Uri.file('/'+p)),sha,dirty:false,orig:text};
    files[p].model.onDidChangeContent(()=>{files[p].dirty=files[p].model.getValue()!==files[p].orig;tabs()});
  }
  cur=p;editor.setModel(files[p].model);tabs();st('Ready');
}
function tabs(){
  $('tabs').innerHTML=Object.keys(files).map(p=>`<div class="tab ${p===cur?'on':''}" data-p="${p}">${p.split('/').pop()}${files[p].dirty?' ●':''} <span data-x="${p}">✕</span></div>`).join('');
}
$('tabs').onclick=e=>{
  if(e.target.dataset.x){const p=e.target.dataset.x;files[p].model.dispose();delete files[p];
    if(cur===p){cur=Object.keys(files)[0]||null;editor.setModel(cur?files[cur].model:null)}tabs();return}
  const t=e.target.closest('.tab');if(t)openFile(t.dataset.p)};
$('newf').onclick=()=>{const n=prompt('File name (e.g. src/app.js)');if(!n)return;
  files[n]={model:monaco.editor.createModel('',undefined,monaco.Uri.file('/'+n)),dirty:true,orig:null,isNew:true};openFile(n)};

async function save(){
  const f=files[cur];if(!f)return;const text=f.model.getValue();
  try{
    if(src.type==='gh'){
      const msg=prompt('Commit message to '+src.repo+'@'+src.br,'Update '+cur);if(!msg)return;
      const r=await gh(`/repos/${src.repo}/contents/${encodeURI(cur)}`,{method:'PUT',body:JSON.stringify({message:msg,content:b64e(text),branch:src.br,sha:f.sha})});
      f.sha=r.content.sha;st('Committed '+r.commit.sha.slice(0,7));
    }else if(src.type==='local'){
      let h=handles[cur];if(!h){const parts=cur.split('/');let d=dirH;for(const s of parts.slice(0,-1))d=await d.getDirectoryHandle(s,{create:true});h=handles[cur]=await d.getFileHandle(parts.pop(),{create:true})}
      const w=await h.createWritable();await w.write(text);await w.close();st('Saved '+cur);
    }else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text]));a.download=cur.split('/').pop();a.click();st('Downloaded')}
    f.orig=text;f.dirty=false;tabs();
  }catch(e){st('Save failed: '+e.message)}
}
$('save').onclick=save;

/* ---------- Ollama (desktop) ---------- */
async function initAI(){
  $('aimsg').style.display='none';$('aibox').style.display='flex';
  try{const j=await (await fetch(OLLAMA+'/api/tags')).json();
    $('model').innerHTML=j.models.map(m=>`<option>${m.name}</option>`).join('')||'<option>No models – run: ollama pull qwen2.5-coder</option>'}
  catch{$('model').innerHTML='<option>Ollama not running</option>'}
}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function fmt(t){return esc(t).replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,'<pre>$2</pre>')}
async function ask(){
  const q=$('q').value.trim();if(!q)return;$('q').value='';
  let ctx='';if(cur){const sel=editor.getModel().getValueInRange(editor.getSelection());
    ctx=`\n\nCurrent file: ${cur}\n\`\`\`\n${(sel||editor.getValue()).slice(0,8000)}\n\`\`\``}
  hist.push({role:'user',content:q+ctx});
  $('log').insertAdjacentHTML('beforeend',`<div class="msg u">${esc(q)}</div><div class="msg" id="cur"></div>`);
  const el=$('cur');let out='';
  try{
    const r=await fetch(OLLAMA+'/api/chat',{method:'POST',body:JSON.stringify({model:$('model').value,stream:true,
      messages:[{role:'system',content:'You are Dunah, a concise coding assistant inside an IDE. Use fenced code blocks.'},...hist]})});
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const l of lines){if(!l)continue;try{out+=JSON.parse(l).message?.content||''}catch{}}
      el.innerHTML=fmt(out);$('log').scrollTop=1e9}
  }catch(e){el.textContent='Error: '+e.message+' (is Ollama running?)'}
  el.removeAttribute('id');hist.push({role:'assistant',content:out});lastAI=out;
}
$('q').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}};
$('clr').onclick=()=>{hist=[];$('log').innerHTML=''};
$('apply').onclick=()=>{const m=[...lastAI.matchAll(/```\w*\n?([\s\S]*?)```/g)].pop();if(!m||!cur)return;
  const sel=editor.getSelection();editor.executeEdits('ai',[{range:sel,text:m[1].replace(/\n$/,'')}])};

/* ---------- Monaco ---------- */
const base='https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min';
require.config({paths:{vs:base+'/vs'}});
window.MonacoEnvironment={getWorkerUrl:()=>URL.createObjectURL(new Blob([`self.MonacoEnvironment={baseUrl:'${base}/'};importScripts('${base}/vs/base/worker/workerMain.js');`],{type:'text/javascript'}))};
require(['vs/editor/editor.main'],()=>{
  monaco.editor.defineTheme('dunah',{base:'vs-dark',inherit:true,rules:[],colors:{'editor.background':'#0f1115','editorCursor.foreground':'#ff8a3d'}});
  editor=monaco.editor.create($('ed'),{theme:'dunah',automaticLayout:true,fontSize:14,minimap:{enabled:true},fontLigatures:true,
    model:null});
  editor.addCommand(monaco.KeyMod.CtrlCmd|monaco.KeyCode.KeyS,save);
  editor.onDidChangeCursorPosition(e=>$('pos').textContent=`Ln ${e.position.lineNumber}, Col ${e.position.column}`);
  files['welcome.js']={model:monaco.editor.createModel('// Welcome to Dunah IDE\n// Sign in with GitHub, pick a repo, or open a local folder.\nconsole.log("Hello, Dunah");\n',undefined,monaco.Uri.file('/welcome.js')),dirty:false,orig:''};
  openFile('welcome.js');
  if(DESKTOP)initAI();
});
</script></body></html>
