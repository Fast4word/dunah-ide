<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Dunah IDE</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2314161c'/%3E%3Cpath d='M18 14h14c11 0 18 8 18 18s-7 18-18 18H18z' fill='%23ff8a3d'/%3E%3Cpath d='M30 25l-7 7 7 7' stroke='%2314161c' stroke-width='4.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#0f1115;--p:#171a21;--p2:#1d212a;--b:#2a2f3a;--t:#d7dae0;--m:#8b93a3;--a:#ff8a3d;--a2:#ff3d71}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font:13px system-ui,Segoe UI,sans-serif;display:grid;grid-template-rows:38px 1fr 24px;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--p);border-bottom:1px solid var(--b)}
header b{font-size:14px;letter-spacing:.5px}.sp{flex:1}
button,select,input,textarea{background:var(--p2);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:4px 9px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--a)}button.pri{background:linear-gradient(135deg,var(--a),var(--a2));border:0;color:#111;font-weight:600}
textarea{width:100%;height:64px;resize:none;padding:6px}
main{display:grid;grid-template-columns:48px 300px 1fr;min-height:0}main.c{grid-template-columns:48px 0 1fr}main.c #side{display:none}
#act{background:#12151b;border-right:1px solid var(--b);display:flex;flex-direction:column;align-items:center;padding-top:4px}
#act button{position:relative;width:48px;height:46px;border:0;border-left:2px solid transparent;border-radius:0;background:none;color:var(--m);display:grid;place-items:center;padding:0}
#act button:hover,#act button.on{color:var(--t)}#act button.on{border-left-color:var(--a)}
#act svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;right:6px;bottom:6px;min-width:16px;height:16px;border-radius:8px;background:var(--a);color:#111;font-size:10px;font-weight:700;display:none;place-items:center;padding:0 3px}
#side{background:var(--p);overflow:auto;padding:8px;min-height:0;border-right:1px solid var(--b)}
.view{display:none;height:100%;min-height:0}.view.on{display:block}#v-ai.on{display:flex;flex-direction:column}
h4{margin:12px 0 6px;color:var(--m);font-size:11px;text-transform:uppercase;letter-spacing:1px}
#side select,#side input:not([type=checkbox]){width:100%;margin-bottom:6px}
.f{padding:3px 6px;cursor:pointer;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.f:hover{background:var(--p2)}.f.m{color:#e6b450}
details>summary{cursor:pointer;padding:3px 4px;color:var(--m)}details>div{padding-left:12px}
.ch{display:flex;align-items:center;gap:6px}.ch .f{flex:1}.ch b{color:#e6b450;width:12px}.x{cursor:pointer;color:var(--m)}.x:hover{color:var(--a)}
#mid{display:grid;grid-template-rows:32px 22px 1fr;min-width:0}
#tabs{display:flex;background:var(--p);overflow-x:auto;border-bottom:1px solid var(--b)}
.tab{padding:7px 12px;cursor:pointer;border-right:1px solid var(--b);color:var(--m);white-space:nowrap}.tab.on{color:var(--t);background:var(--bg);box-shadow:inset 0 -2px var(--a)}
#crumb{padding:3px 12px;color:var(--m);font-size:12px}#ed{min-height:0}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:6px 0}
.msg{padding:8px;border-radius:8px;background:var(--p2);white-space:pre-wrap;word-break:break-word}.msg.u{background:#2a2f3a}
.msg pre{background:#0b0d11;padding:8px;border-radius:6px;overflow:auto;margin:6px 0}
footer{display:flex;gap:16px;align-items:center;padding:0 10px;background:linear-gradient(90deg,var(--a),var(--a2));color:#111;font-size:12px}
.mut{color:var(--m)}
#pal{position:fixed;inset:0;display:none;justify-items:center;align-items:start;padding-top:10vh;background:#0008;z-index:9}
#pal>div{width:min(620px,92vw);background:var(--p);border:1px solid var(--b);border-radius:10px;padding:8px}
#pal input{width:100%;margin-bottom:6px}#pl{max-height:50vh;overflow:auto}#pl .f.s{background:#2a2f3a}
@media(max-width:900px){main{grid-template-columns:48px 220px 1fr}}
</style></head><body>
<header>
<svg width="26" height="26" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff3d71"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="#14161c"/><path d="M18 14h14c11 0 18 8 18 18s-7 18-18 18H18z" fill="url(#g)"/><path d="M18 42c9-9 15 3 32-7-1 9-8 15-18 15H18z" fill="#fff" opacity=".22"/><path d="M30 25l-7 7 7 7" stroke="#14161c" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
<b>Dunah IDE</b>
<button id="newf">New file</button><button id="openf">Open folder</button>
<span class="sp"></span><button id="cmd" class="mut">Go to file / command… Ctrl+P</button><span class="sp"></span>
<span id="user" class="mut"></span><button id="login" class="pri">Sign in with GitHub</button>
</header>
<main>
<nav id="act">
<button data-v="files" class="on" title="Files (Ctrl+Shift+E)"><svg viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5zM14 3v5h5"/></svg></button>
<button data-v="search" title="Search (Ctrl+Shift+F)"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M15 15l6 6"/></svg></button>
<button data-v="gh" title="Source Control & GitHub (Ctrl+Shift+G)"><svg viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 5-12 2-12 7"/></svg><span id="badge" class="badge"></span></button>
<button data-v="ai" title="Assistant (Ollama)"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
</nav>
<div id="side">
<div id="v-files" class="view on"><h4 style="margin-top:0">Explorer</h4>
<div id="tree"><div class="mut">No folder open.</div><p><button id="o2">Open folder</button> <button id="g2">GitHub repository…</button></p></div></div>
<div id="v-search" class="view"><h4 style="margin-top:0">Search</h4><input id="sq" placeholder="Search in files (Enter)"><div id="sr" class="mut"></div></div>
<div id="v-gh" class="view"><h4 style="margin-top:0">GitHub</h4>
<select id="repos"><option>Sign in to load repos</option></select><select id="branches"><option>Branch</option></select>
<h4>Changes <span id="cnt" class="mut"></span></h4><div id="changes"></div>
<textarea id="msg" placeholder="Commit message"></textarea>
<button id="commit" class="pri" style="width:100%;margin-top:6px">Commit & push</button></div>
<div id="v-ai" class="view"><h4 style="margin-top:0">Assistant · Ollama</h4>
<div id="aimsg" class="mut">The Ollama assistant is available in the Dunah IDE Windows desktop app.</div>
<div id="aibox" style="display:none;flex:1;flex-direction:column;min-height:0"><select id="model"></select><div id="log"></div>
<textarea id="q" placeholder="Ask about your code… (Enter to send)"></textarea>
<div style="display:flex;gap:6px;margin-top:6px"><button id="apply">Apply last code block</button><button id="clr">Clear</button></div></div></div>
</div>
<div id="mid"><div id="tabs"></div><div id="crumb"></div><div id="ed"></div></div>
</main>
<footer><span id="st">Ready</span><span id="prob">⛔ 0 ⚠ 0</span><span id="lang"></span><span id="pos"></span><span class="sp"></span><span id="src">Scratch</span></footer>
<div id="pal"><div><input id="pi" placeholder="Type a file name, or > for commands"><div id="pl"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script>
const SB_URL='https://ermvrzqbxncmirhotrkv.supabase.co',SB_KEY='sb_publishable_azqJ_oKBUM047I13cFg-7w_xkIYK73t';
const OLLAMA='http://localhost:11434',DESKTOP=navigator.userAgent.includes('Electron');
const $=id=>document.getElementById(id),st=t=>$('st').textContent=t;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sb=supabase.createClient(SB_URL,SB_KEY);
let editor,files={},cur=null,src={type:'scratch'},ghTok=localStorage.getItem('dunah_gh'),lastAI='',hist=[],allPaths=['welcome.js'],off=new Set(),dirH=null,handles={};

/* ---------- Activity bar ---------- */
function show(v,force){
  const m=document.querySelector('main'),same=document.querySelector('#act .on')?.dataset.v===v;
  if(same&&!force)m.classList.toggle('c');else m.classList.remove('c');
  document.querySelectorAll('#act button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
}
$('act').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.v)};

/* ---------- Auth ---------- */
sb.auth.onAuthStateChange((_e,s)=>{
  if(s?.provider_token){ghTok=s.provider_token;localStorage.setItem('dunah_gh',ghTok)}
  const u=s?.user?.user_metadata;$('user').textContent=s?u?.user_name||u?.preferred_username||s.user.email:'';
  $('login').textContent=s?'Sign out':'Sign in with GitHub';
  if(s&&ghTok){loadRepos();show('gh',true)}
});
$('login').onclick=async()=>{
  const {data}=await sb.auth.getSession();
  if(data.session){await sb.auth.signOut();localStorage.removeItem('dunah_gh');ghTok=null;location.reload()}
  else sb.auth.signInWithOAuth({provider:'github',options:{scopes:'repo read:user',redirectTo:location.origin+location.pathname}});
};

/* ---------- GitHub ---------- */
const gh=async(p,o={})=>{const r=await fetch('https://api.github.com'+p,{...o,headers:{Authorization:'Bearer '+ghTok,Accept:'application/vnd.github+json',...(o.headers||{})}});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120));return r.json()};
const post=(p,b,m='POST')=>gh(p,{method:m,body:JSON.stringify(b)});
const b64d=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')),c=>c.charCodeAt(0)));
async function loadRepos(){
  try{const rs=await gh('/user/repos?per_page=100&sort=pushed');
  $('repos').innerHTML='<option value="">Select a repository…</option>'+rs.map(r=>`<option>${r.full_name}</option>`).join('')}
  catch(e){st('GitHub: '+e.message)}
}
function guard(){return !Object.values(files).some(f=>f.dirty)||confirm('You have uncommitted changes that will be lost. Continue?')}
async function loadRepo(repo,br){
  if(!guard())return;st('Loading '+repo+'…');
  try{
    if(!br){br=(await gh('/repos/'+repo)).default_branch;const bs=await gh(`/repos/${repo}/branches?per_page=100`);
      $('branches').innerHTML=bs.map(b=>`<option ${b.name===br?'selected':''}>${b.name}</option>`).join('')}
    const t=await gh(`/repos/${repo}/git/trees/${br}?recursive=1`);
    Object.keys(files).forEach(p=>{files[p].model.dispose();delete files[p]});cur=null;editor.setModel(null);
    src={type:'gh',repo,br};$('src').textContent=`⎇ ${br} · ${repo}`;
    renderTree(t.tree.filter(x=>x.type==='blob').map(x=>x.path));show('files',true);tabs();st(t.truncated?'Tree truncated':'Loaded '+repo);
  }catch(e){st(e.message)}
}
$('repos').onchange=e=>e.target.value&&loadRepo(e.target.value);
$('branches').onchange=e=>loadRepo(src.repo,e.target.value);

/* ---------- Local folder ---------- */
async function openFolder(){
  if(!window.showDirectoryPicker)return alert('Open Folder needs a Chromium browser (Chrome/Edge) or the desktop app.');
  dirH=await showDirectoryPicker({mode:'readwrite'});handles={};const paths=[];
  async function walk(d,p){for await(const [n,h] of d.entries()){
    if(['node_modules','.git','dist'].includes(n)||paths.length>3000)continue;
    if(h.kind==='directory')await walk(h,p+n+'/');else{handles[p+n]=h;paths.push(p+n)}}}
  await walk(dirH,'');src={type:'local'};$('src').textContent='Local: '+dirH.name;renderTree(paths);show('files',true);
}
$('openf').onclick=$('o2').onclick=openFolder;$('g2').onclick=()=>show('gh',true);
async function writeLocal(p){
  let h=handles[p];if(!h){const parts=p.split('/');let d=dirH;for(const s of parts.slice(0,-1))d=await d.getDirectoryHandle(s,{create:true});h=handles[p]=await d.getFileHandle(parts.pop(),{create:true})}
  const w=await h.createWritable();await w.write(files[p].model.getValue());await w.close();
}

/* ---------- Tree / tabs ---------- */
function renderTree(paths){
  allPaths=[...new Set(paths)];
  const root={};allPaths.slice().sort().forEach(p=>{let n=root;p.split('/').forEach((s,i,a)=>{n=n[s]??=(i==a.length-1?p:{})})});
  const h=n=>Object.entries(n).sort((a,b)=>(typeof b[1]=='object')-(typeof a[1]=='object')).map(([k,v])=>
    typeof v==='string'?`<div class="f" data-p="${esc(v)}">${esc(k)}</div>`:`<details><summary>${esc(k)}</summary><div>${h(v)}</div></details>`).join('');
  $('tree').innerHTML=h(root);scm();
}
$('tree').onclick=e=>{const p=e.target.dataset?.p;if(p)openFile(p)};
async function openFile(p,line,q){
  if(!files[p]){
    let text='';st('Opening '+p+'…');
    try{
      if(src.type==='gh')text=b64d((await gh(`/repos/${src.repo}/contents/${encodeURI(p)}?ref=${src.br}`)).content);
      else if(src.type==='local')text=await (await handles[p].getFile()).text();
    }catch(e){return st(e.message)}
    const f=files[p]={model:monaco.editor.createModel(text,undefined,monaco.Uri.file('/'+p)),dirty:false,orig:text};
    f.model.onDidChangeContent(()=>{f.dirty=f.isNew||f.model.getValue()!==f.orig;tabs()});
  }
  cur=p;editor.setModel(files[p].model);tabs();st('Ready');
  if(q){const m=files[p].model.findMatches(q,false,false,false,null,false,1)[0];if(m){editor.setSelection(m.range);editor.revealRangeInCenter(m.range)}}
  else if(line){editor.setPosition({lineNumber:line,column:1});editor.revealLineInCenter(line)}
  editor.focus();
}
function tabs(){
  $('tabs').innerHTML=Object.keys(files).map(p=>`<div class="tab ${p===cur?'on':''}" data-p="${esc(p)}">${esc(p.split('/').pop())}${files[p].dirty?' ●':''} <span data-x="${esc(p)}">✕</span></div>`).join('');
  $('crumb').textContent=cur?cur.split('/').join('  ›  '):'';
  $('lang').textContent=editor?.getModel()?.getLanguageId()||'';scm();
}
$('tabs').onclick=e=>{
  const x=e.target.dataset.x;
  if(x){if(files[x].dirty&&!confirm('Discard unsaved changes to '+x+'?'))return;closeFile(x);return}
  const t=e.target.closest('.tab');if(t)openFile(t.dataset.p)};
function closeFile(p){files[p].model.dispose();delete files[p];
  if(cur===p){cur=Object.keys(files)[0]||null;editor.setModel(cur?files[cur].model:null)}tabs()}
function newFile(){const n=prompt('File name (e.g. src/app.js)');if(!n)return;
  files[n]={model:monaco.editor.createModel('',undefined,monaco.Uri.file('/'+n)),dirty:true,orig:'',isNew:true};
  files[n].model.onDidChangeContent(()=>{files[n].dirty=files[n].isNew||files[n].model.getValue()!==files[n].orig;tabs()});
  if(!allPaths.includes(n))renderTree([...allPaths,n]);openFile(n)}
$('newf').onclick=newFile;

/* ---------- Source control (multi-file commit) ---------- */
function scm(){
  const ch=Object.keys(files).filter(p=>files[p].dirty);
  $('changes').innerHTML=ch.map(p=>`<div class="ch"><input type="checkbox" data-s="${esc(p)}" ${off.has(p)?'':'checked'}><span class="f" data-p="${esc(p)}" title="${esc(p)}">${esc(p)}</span><b>${files[p].isNew?'A':'M'}</b><span class="x" data-d="${esc(p)}" title="Discard changes">↺</span></div>`).join('')||'<div class="mut">No changes</div>';
  $('cnt').textContent=ch.length||'';$('badge').textContent=ch.length;$('badge').style.display=ch.length?'grid':'none';
  $('commit').textContent=src.type==='gh'?'Commit & push':src.type==='local'?'Save selected':'Download selected';
  document.querySelectorAll('#tree .f').forEach(n=>n.classList.toggle('m',!!files[n.dataset.p]?.dirty));
}
$('changes').onclick=e=>{const d=e.target.dataset;
  if(d.d){const f=files[d.d];if(f.isNew)closeFile(d.d);else f.model.setValue(f.orig)}else if(d.p)openFile(d.p)};
$('changes').onchange=e=>{const p=e.target.dataset.s;e.target.checked?off.delete(p):off.add(p)};
$('commit').onclick=async()=>{
  const ps=Object.keys(files).filter(p=>files[p].dirty&&!off.has(p));if(!ps.length)return st('Nothing selected to commit');
  try{
    if(src.type==='gh'){
      const msg=$('msg').value.trim();if(!msg)return st('Enter a commit message');st('Committing…');
      const {repo,br}=src,parent=(await gh(`/repos/${repo}/git/ref/heads/${br}`)).object.sha;
      const base=(await gh(`/repos/${repo}/git/commits/${parent}`)).tree.sha,tree=[];
      for(const p of ps){const b=await post(`/repos/${repo}/git/blobs`,{content:files[p].model.getValue(),encoding:'utf-8'});tree.push({path:p,mode:'100644',type:'blob',sha:b.sha})}
      const nt=await post(`/repos/${repo}/git/trees`,{base_tree:base,tree});
      const c=await post(`/repos/${repo}/git/commits`,{message:msg,tree:nt.sha,parents:[parent]});
      await post(`/repos/${repo}/git/refs/heads/${br}`,{sha:c.sha},'PATCH');
      $('msg').value='';st(`Committed ${ps.length} file(s) · ${c.sha.slice(0,7)}`);
    }else for(const p of ps){
      if(src.type==='local')await writeLocal(p);
      else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([files[p].model.getValue()]));a.download=p.split('/').pop();a.click()}
    }
    ps.forEach(p=>{files[p].orig=files[p].model.getValue();files[p].dirty=files[p].isNew=false});tabs();
  }catch(e){st('Failed: '+e.message)}
};
async function save(){
  if(!cur)return;
  if(src.type==='gh'){show('gh',true);return st('Change tracked in Source Control — pick files and commit')}
  off.clear();const o=new Set(Object.keys(files).filter(p=>p!==cur));o.forEach(p=>off.add(p));await $('commit').onclick();off.clear();
}

/* ---------- Search ---------- */
$('sq').onkeydown=async e=>{
  if(e.key!=='Enter')return;const q=e.target.value.trim();if(!q)return;$('sr').textContent='Searching…';
  const ql=q.toLowerCase(),out=[],seen=new Set();
  for(const [p,f] of Object.entries(files)){seen.add(p);
    f.model.findMatches(q,false,false,false,null,false,50).forEach(m=>out.push({p,l:m.range.startLineNumber,t:f.model.getLineContent(m.range.startLineNumber).trim().slice(0,100)}))}
  try{
    if(src.type==='local'){let n=0;for(const p of Object.keys(handles)){
      if(seen.has(p)||n++>600||out.length>300)continue;const f=await handles[p].getFile();if(f.size>5e5)continue;
      (await f.text()).split('\n').forEach((ln,i)=>{if(ln.toLowerCase().includes(ql))out.push({p,l:i+1,t:ln.trim().slice(0,100)})})}}
    else if(src.type==='gh'){const r=await gh(`/search/code?q=${encodeURIComponent(q)}+repo:${src.repo}&per_page=40`);
      r.items.forEach(i=>{if(!seen.has(i.path))out.push({p:i.path,l:0,t:''})})}
  }catch(err){return $('sr').textContent=err.message}
  allPaths.filter(p=>p.toLowerCase().includes(ql)&&!out.some(o=>o.p===p)).slice(0,20).forEach(p=>out.push({p,l:0,t:'filename match'}));
  $('sr').innerHTML=out.map(o=>`<div class="f" data-p="${esc(o.p)}" data-l="${o.l}" data-q="${esc(q)}"><b>${esc(o.p.split('/').pop())}</b> <span class="mut">${o.l?':'+o.l+' ':''}${esc(o.t)}</span></div>`).join('')||'No results';
};
$('sr').onclick=e=>{const d=e.target.closest('.f')?.dataset;if(d)openFile(d.p,+d.l,d.q)};

/* ---------- Command palette ---------- */
const tog=o=>editor.updateOptions(o);
const CMDS={
 'New file':newFile,'Open folder':openFolder,'Save / save selected changes':save,
 'Commit changes (Source Control)':()=>{show('gh',true);$('msg').focus()},
 'Toggle sidebar':()=>document.querySelector('main').classList.toggle('c'),
 'View: Files':()=>show('files',true),'View: Search':()=>{show('search',true);$('sq').focus()},
 'View: Source Control':()=>show('gh',true),'View: Assistant':()=>show('ai',true),
 'Format document':()=>editor.getAction('editor.action.formatDocument').run(),
 'Go to line…':()=>editor.getAction('editor.action.gotoLine').run(),
 'Toggle word wrap':()=>tog({wordWrap:editor.getOption(monaco.editor.EditorOption.wordWrap)==='on'?'off':'on'}),
 'Toggle minimap':()=>tog({minimap:{enabled:!editor.getOption(monaco.editor.EditorOption.minimap).enabled}}),
 'Sign in / out of GitHub':()=>$('login').click()};
let pidx=0,pitems=[];
const fz=(q,s)=>{q=q.toLowerCase();s=s.toLowerCase();let i=0;for(const c of s)if(c===q[i])i++;return i===q.length};
function pal(q){$('pal').style.display='grid';$('pi').value=q;$('pi').focus();plist()}
function plist(){
  const v=$('pi').value,cmd=v.startsWith('>'),q=(cmd?v.slice(1):v).trim();
  pitems=(cmd?Object.keys(CMDS):allPaths).filter(s=>fz(q,s)).slice(0,40).map(s=>({s,cmd}));pidx=Math.min(pidx,Math.max(0,pitems.length-1));
  $('pl').innerHTML=pitems.map((o,i)=>`<div class="f ${i===pidx?'s':''}" data-i="${i}">${esc(o.s)}</div>`).join('')||'<div class="mut">No matches</div>';
}
function prun(i){const o=pitems[i];$('pal').style.display='none';if(!o)return;o.cmd?CMDS[o.s]():openFile(o.s)}
$('pi').oninput=()=>{pidx=0;plist()};
$('pi').onkeydown=e=>{
  if(e.key==='Escape')$('pal').style.display='none';
  else if(e.key==='ArrowDown'){pidx=Math.min(pidx+1,pitems.length-1);plist();e.preventDefault()}
  else if(e.key==='ArrowUp'){pidx=Math.max(pidx-1,0);plist();e.preventDefault()}
  else if(e.key==='Enter')prun(pidx)};
$('pl').onclick=e=>{const i=e.target.dataset.i;if(i!=null)prun(+i)};
$('pal').onmousedown=e=>{if(e.target.id==='pal')$('pal').style.display='none'};
$('cmd').onclick=()=>pal('');
addEventListener('keydown',e=>{
  const c=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();if(!c)return;
  if(k==='p'){e.preventDefault();pal(e.shiftKey?'>':'')}
  else if(k==='b'){e.preventDefault();CMDS['Toggle sidebar']()}
  else if(e.shiftKey&&k==='f'){e.preventDefault();CMDS['View: Search']()}
  else if(e.shiftKey&&k==='g'){e.preventDefault();show('gh',true)}
  else if(e.shiftKey&&k==='e'){e.preventDefault();show('files',true)}
  else if(k==='s'){e.preventDefault();save()}
},true);

/* ---------- Ollama (desktop) ---------- */
async function initAI(){
  $('aimsg').style.display='none';$('aibox').style.display='flex';
  try{const j=await (await fetch(OLLAMA+'/api/tags')).json();
    $('model').innerHTML=j.models.map(m=>`<option>${m.name}</option>`).join('')||'<option>No models – run: ollama pull qwen2.5-coder</option>'}
  catch{$('model').innerHTML='<option>Ollama not running</option>'}
}
const fmt=t=>esc(t).replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,'<pre>$2</pre>');
async function ask(){
  const q=$('q').value.trim();if(!q)return;$('q').value='';
  let ctx='';if(cur){const sel=editor.getModel().getValueInRange(editor.getSelection());
    ctx=`\n\nCurrent file: ${cur}\n\`\`\`\n${(sel||editor.getValue()).slice(0,8000)}\n\`\`\``}
  hist.push({role:'user',content:q+ctx});
  $('log').insertAdjacentHTML('beforeend',`<div class="msg u">${esc(q)}</div><div class="msg" id="cur"></div>`);
  const el=$('cur');let out='';
  try{
    const r=await fetch(OLLAMA+'/api/chat',{method:'POST',body:JSON.stringify({model:$('model').value,stream:true,
      messages:[{role:'system',content:'You are Dunah, a concise coding assistant inside an IDE. Use fenced code blocks.'},...hist]})});
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const l of lines){if(!l)continue;try{out+=JSON.parse(l).message?.content||''}catch{}}
      el.innerHTML=fmt(out);$('log').scrollTop=1e9}
  }catch(e){el.textContent='Error: '+e.message+' (is Ollama running?)'}
  el.removeAttribute('id');hist.push({role:'assistant',content:out});lastAI=out;
}
$('q').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}};
$('clr').onclick=()=>{hist=[];$('log').innerHTML=''};
$('apply').onclick=()=>{const m=[...lastAI.matchAll(/```\w*\n?([\s\S]*?)```/g)].pop();if(!m||!cur)return;
  editor.executeEdits('ai',[{range:editor.getSelection(),text:m[1].replace(/\n$/,'')}])};

/* ---------- Monaco ---------- */
const base='https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min';
require.config({paths:{vs:base+'/vs'}});
window.MonacoEnvironment={getWorkerUrl:()=>URL.createObjectURL(new Blob([`self.MonacoEnvironment={baseUrl:'${base}/'};importScripts('${base}/vs/base/worker/workerMain.js');`],{type:'text/javascript'}))};
require(['vs/editor/editor.main'],()=>{
  monaco.editor.defineTheme('dunah',{base:'vs-dark',inherit:true,rules:[],colors:{'editor.background':'#0f1115','editorCursor.foreground':'#ff8a3d'}});
  editor=monaco.editor.create($('ed'),{theme:'dunah',automaticLayout:true,fontSize:14,minimap:{enabled:true},fontLigatures:true,bracketPairColorization:{enabled:true},model:null});
  editor.onDidChangeCursorPosition(e=>$('pos').textContent=`Ln ${e.position.lineNumber}, Col ${e.position.column}`);
  monaco.editor.onDidChangeMarkers(()=>{const m=monaco.editor.getModelMarkers({});
    $('prob').textContent=`⛔ ${m.filter(x=>x.severity===8).length} ⚠ ${m.filter(x=>x.severity===4).length}`});
  const f=files['welcome.js']={model:monaco.editor.createModel('// Welcome to Dunah IDE\n// Ctrl+P: go to file · Ctrl+Shift+P: commands · Ctrl+Shift+F: search\n// Edit several files, then commit them together from Source Control.\nconsole.log("Hello, Dunah");\n',undefined,monaco.Uri.file('/welcome.js')),dirty:false,orig:''};
  f.orig=f.model.getValue();f.model.onDidChangeContent(()=>{f.dirty=f.model.getValue()!==f.orig;tabs()});
  renderTree(allPaths);openFile('welcome.js');
  if(DESKTOP)initAI();
});
